name: Bump version, build and release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tox:
    uses: ./.github/workflows/tox.yaml
    permissions:
      contents: read

  tag:
    name: Tag release
    runs-on: ubuntu-latest
    needs: tox
    outputs:
      new_tag: ${{ steps.next_version.outputs.new_tag }}
      new_version: ${{ steps.next_version.outputs.new_version }}
      changelog: ${{ steps.next_version.outputs.changelog }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine the next version
        id: next_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          # This step only calculates the version and changelog. The tag is
          # created below after the version-bump commit has been pushed.
          dry_run: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Commit the version update
        run: |
          uv version ${{ steps.next_version.outputs.new_version }}
          # Use the workflow actor for commit attribution to make the
          # author readable and avoid embedding an internal numeric id.
          # This resolves to e.g. "actions-user@users.noreply.github.com".
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "ci(release): ${{ steps.next_version.outputs.new_tag }}"
          git push origin HEAD:main

      - name: Create and push release tag
        run: |
          git tag "${{ steps.next_version.outputs.new_tag }}"
          git push origin "${{ steps.next_version.outputs.new_tag }}"

  build:
    name: Build distribution artifacts
    runs-on: ubuntu-latest
    needs: tag

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.new_tag }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build wheel and source distribution
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distribution-artifacts
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: distribution-artifacts
          path: dist

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Publish distribution artifacts
        run: uv publish --token "${{ secrets.PYPI_TOKEN }}" dist/*

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [tag, build, publish]

    permissions:
      contents: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: distribution-artifacts
          path: dist

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.tag.outputs.new_tag }}
          name: Release ${{ needs.tag.outputs.new_tag }}
          body: ${{ needs.tag.outputs.changelog }}
          artifacts: dist/*
