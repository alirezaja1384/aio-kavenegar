name: Tox

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  # `github.workflow` refers to the caller when this workflow is reused.
  # Use a distinct namespace so the called workflow cannot cancel its caller.
  group: tox-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tox:
    name: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [py310, py311, py312, py313, py314, lint]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run tox
        run: uv run --locked tox -e ${{ matrix.environment }}
